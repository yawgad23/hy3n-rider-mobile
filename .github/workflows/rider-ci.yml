name: Rider app CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "audit/**"]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TypeScript check
        run: pnpm check
      - name: Unit tests
        run: pnpm test
