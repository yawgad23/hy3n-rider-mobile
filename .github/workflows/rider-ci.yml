name: Rider app CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "audit/**", "task/rider-xcode27-configuration-*"]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: SDK dependency alignment (no native generation or build)
        run: pnpm exec expo install --check
      - name: Apple native source integration
        run: pnpm check:apple-native
      - name: TypeScript check
        run: pnpm check
      - name: Unit tests
        run: pnpm test
      - name: Expo lint
        run: pnpm lint
