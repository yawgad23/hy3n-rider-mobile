name: HY3N Rider Android Play Store

on:
  workflow_dispatch:
    inputs:
      confirm_deployment:
        description: "Confirm a paid EAS Android build and Google Play Production submission"
        required: true
        type: boolean
        default: false
  push:
    tags:
      - "rider-v1.0.4"

permissions:
  contents: read

concurrency:
  group: rider-android-playstore-production
  cancel-in-progress: false

env:
  EXPECTED_VERSION: "1.0.4"
  EXPECTED_VERSION_CODE: "58023"

jobs:
  preflight:
    if: ${{ github.event_name == 'push' || inputs.confirm_deployment == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Verify required secrets are configured
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN" || { echo "::error::EXPO_TOKEN is missing."; exit 1; }
          test -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" || { echo "::error::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is missing."; exit 1; }
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > google-play-service-account.json
          node -e "const p=require('./google-play-service-account.json'); if (!p.client_email || !p.private_key) process.exit(1); console.log('Google Play service-account JSON is valid.')"
          rm -f google-play-service-account.json
          eas whoami

      - name: Verify Rider release version
        run: |
          set -euo pipefail
          config="$(npx expo config --json)"
          version="$(printf '%s' "$config" | node -e "let s=''; process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).version))")"
          version_code="$(printf '%s' "$config" | node -e "let s=''; process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).android.versionCode))")"
          test "$version" = "$EXPECTED_VERSION" || { echo "::error::Expected version $EXPECTED_VERSION, got $version"; exit 1; }
          test "$version_code" = "$EXPECTED_VERSION_CODE" || { echo "::error::Expected version code $EXPECTED_VERSION_CODE, got $version_code"; exit 1; }
          echo "Preparing Rider $version ($version_code)."

      - name: TypeScript check
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Expo lint
        run: pnpm lint

  build-and-submit:
    if: ${{ github.event_name == 'push' || inputs.confirm_deployment == true }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: playstore-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Write temporary Google Play credentials
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > google-play-service-account.json
          chmod 600 google-play-service-account.json

      - name: Build Rider Android production AAB
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile production --non-interactive --wait

      - name: Submit latest Rider AAB to Google Play Production
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas submit --platform android --profile production --latest --non-interactive

      - name: Remove temporary Google Play credentials
        if: ${{ always() }}
        run: rm -f google-play-service-account.json
